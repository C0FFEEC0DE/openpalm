[package]
name = "openpalm"
version = "0.1.0"
edition = "2021"
description = "Rust library for Palm OS device communication (pilot-link port)"
readme = "README.md"
license = "GPL-2.0"
repository = "https://github.com/chaos-weaver/openpalm"
authors = ["Your Name"]
keywords = ["palm", "hotsync", "pilot", "sync", "embedded"]
categories = ["embedded", "hardware-support", "protocols"]

[lib]
name = "openpalm"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serial port
serialport = { version = "4", optional = true }

# USB communication (requires libusb-1.0 development libraries)
# On Ubuntu/Debian: sudo apt install libusb-1.0-0-dev
# On Fedora/RHEL: sudo dnf install libusb1-devel
# On macOS: comes with OS
# On Windows: use Zadig to install WinUSB driver
libusb1-sys = { version = "0.7", features = ["vendored"], optional = true }

# Data structures
bytes = "1"
bitflags = "2"

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
time = "0.3"
md5 = "0.7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits
async-trait = "0.1"

# Utilities
once_cell = "1"
encoding_rs = "0.8"

# CLI dependencies
clap = { version = "4", features = ["derive"] }
serde_json = "1"
comfy-table = "7"

[features]
default = ["serial", "usb"]
net = []
serial = ["dep:serialport"]
usb = ["dep:libusb1-sys"]

[dev-dependencies]
# Testing
tokio-test = "0.4"
proptest = "1"
quickcheck = "1"

# Snapshot testing
insta = { version = "1", features = ["yaml"] }

# Mocking
mockall = "0.12"

[[bin]]
name = "op"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
