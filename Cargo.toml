[package]
name = "openpalm"
version = "0.1.0"
edition = "2021"
description = "Rust library for Palm OS device communication (pilot-link port)"
readme = "README.md"
license = "GPL-2.0"
repository = "https://github.com/chaos-weaver/openpalm"
authors = ["Your Name"]
keywords = ["palm", "hotsync", "pilot", "sync", "embedded"]
categories = ["embedded", "hardware-support", "protocols"]

[lib]
name = "openpalm"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serial port
serialport = "4"

# USB communication (requires libusb-1.0 development libraries)
# On Ubuntu/Debian: sudo apt install libusb-1.0-0-dev
# On Fedora/RHEL: sudo dnf install libusb1-devel
# On macOS: comes with OS
# On Windows: use Zadig to install WinUSB driver
libusb1-sys = { version = "0.7", features = ["vendored"] }

# Data structures
bytes = "1"
bitflags = "2"

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
time = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits
async-trait = "0.1"

# Utilities
once_cell = "1"

[dev-dependencies]
# Testing
tokio-test = "0.4"
proptest = "1"
quickcheck = "1"

# Snapshot testing
insta = { version = "1", features = ["yaml"] }

# Mocking
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
